<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Bài tập thực hành 5.9</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Helvetica, Arial, sans-serif;
        }

        .main-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
        }

        .btn-facebook {
            background-color: #1877f2;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            transition: background-color 0.3s ease;
        }

        .btn-facebook:hover { background-color: #166fe5; color: white; }
        .btn-facebook i { margin-right: 10px; font-size: 1.3rem; }

        .json-box {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            overflow-x: auto;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <div class="card p-4" id="loginSection">
        <div class="text-center mb-4 mt-2">
            <h2 style="color: #1877f2; font-weight: bold;">Đăng Nhập</h2>
            <p class="text-muted">Bài tập thực hành 5.9</p>
        </div>
        
        <div class="card-body p-0">
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-facebook btn-lg" id="btnFacebookLogin">
                    <i class="fa-brands fa-facebook"></i> Login with Facebook
                </button>
            </div>
        </div>
    </div>

    <div class="card p-4" id="profileSection" style="display: none;">
        <div class="text-center">
            <img id="profilePicture" src="" alt="Avatar" class="rounded-circle mb-3 border border-3 border-primary" style="width: 120px; height: 120px; object-fit: cover;">
            
            <h3 id="profileName" class="fw-bold mb-1">Đang tải...</h3>
            <p id="profileEmail" class="text-muted mb-3">Đang tải...</p>
            
            <button id="btnLogout" class="btn btn-outline-danger btn-sm mb-4">Đăng xuất</button>
        </div>

        <hr>
        
        <div>
            <h6 class="fw-bold mb-2 text-secondary">Kết quả API trả về (JSON):</h6>
            <pre class="json-box" id="jsonResult"></pre>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    window.fbAsyncInit = function() {
        FB.init({
            appId      : '2028420931352860',
            cookie     : true,
            xfbml      : true,
            version    : 'v19.0'
        });
        
        FB.getLoginStatus(function(response) {
            statusChangeCallback(response);
        });
    };

    (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/vi_VN/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    function statusChangeCallback(response) {
        if (response.status === 'connected') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'block';
            
            FB.api('/me?fields=id,name,email,picture', function(userInfo) {
                console.log('Dữ liệu API:', userInfo);
                
                document.getElementById('profileName').textContent = userInfo.name;
                document.getElementById('profileEmail').textContent = userInfo.email || "Không có email";
                
                if(userInfo.picture && userInfo.picture.data && userInfo.picture.data.url) {
                    document.getElementById('profilePicture').src = userInfo.picture.data.url;
                }

                document.getElementById('jsonResult').textContent = JSON.stringify(userInfo, null, 4);
            });
            
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('profileSection').style.display = 'none';
        }
    }

    document.getElementById('btnFacebookLogin').addEventListener('click', function() {
        FB.login(function(response) {
            statusChangeCallback(response);
        }, {scope: 'public_profile,email'});
    });

    document.getElementById('btnLogout').addEventListener('click', function() {
        FB.logout(function(response) {
            console.log('Đã đăng xuất');
            statusChangeCallback(response);
        });
    });
</script>

</body>
</html>
